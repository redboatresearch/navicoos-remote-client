<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B&amp;G MFD Remote Display</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        font-family: system-ui, sans-serif;
      }
      #stage {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #video {
        display: block;
        width: 100%;
        max-width: 1396px;
        height: auto;
        touch-action: none;
      }
      #buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        padding: 12px;
        width: 100%;
        box-sizing: border-box;
      }
      .mfd-btn {
        flex: 0 0 auto;
        min-width: 72px;
        padding: 12px 16px;
        font-size: 15px;
        color: #eee;
        background: #1c1c1e;
        border: 1px solid #3a3a3c;
        border-radius: 8px;
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
      }
      .mfd-btn:active {
        background: #0a84ff;
        border-color: #0a84ff;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="video"></canvas>
      <div id="buttons"></div>
    </div>
    <script type="module" src="./decoder.js"></script>
  </body>
</html>
